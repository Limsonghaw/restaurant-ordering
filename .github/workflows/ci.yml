name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build supabase production
        run: npm run build
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_DATA_SOURCE: supabase
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder-site-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - name: Check production artifacts for mock code
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const forbidden = /开发用模拟控制面板|mock-trigger|ro-mock:state|mock-captcha-ok|ro-mock:live-b|mock-live-device/;
          function check(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) check(path);
              else if (/\.(js|html)$/.test(entry.name) && forbidden.test(readFileSync(path, 'utf8'))) {
                throw new Error(`Mock code found in ${path}`);
              }
            }
          }
          check('.next/static');
          check('.next/server/app');
          NODE
      - name: Clear production build before mock build
        run: rm -rf .next
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://site.example.invalid
          NEXT_PUBLIC_DATA_SOURCE: mock
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: placeholder-site-key

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:db:unit
      - run: npx --no-install supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run test:db
      - if: always()
        run: npx --no-install supabase stop --no-backup
